{{define "guestbook"}}
<!DOCTYPE html>
<html lang="en">

{{template "head" .}}

<body class="bg-neutral-50 text-neutral-900 min-h-screen flex flex-col">

    {{template "nav" .}}

    <main class="flex-1 max-w-3xl mx-auto px-6 py-12 w-full">

        <section class="mb-12">
            <h1 class="text-4xl font-bold text-neutral-900 mb-3">Guestbook</h1>
            <p class="text-lg text-neutral-600 leading-relaxed">Drop a message for me.</p>
        </section>
        
        <form method="POST" action="/guestbook" class="w-full flex flex-col gap-3 mb-8">
            <input type="text" name="name" placeholder="Your Name" class="w-full border border-neutral-300 rounded-md p-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500" required>
            <textarea name="message" placeholder="Your Message" class="w-full border border-neutral-300 rounded-md p-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500" required></textarea>
            <button type="submit" class=" self-center bg-purple-600 text-white px-4 py-2 rounded-md hover:bg-purple-700 transition-colors">Sign Guestbook</button>
        </form>

        <h2 class="text-xl font-semibold text-neutral-800 mb-5">Messages</h2>

        <div class="flex flex-col gap-4">
            {{range .Messages}}
            <div class="bg-white border border-neutral-200 rounded-xl p-5 shadow-sm hover:shadow-md hover:border-purple-200 transition-all">
                <div class="flex items-center justify-between mb-1">
                    <span class="font-semibold text-neutral-900">{{.Name}}</span>
                    <time datetime='{{ .Timestamp.UTC.Format "2006-01-02T15:04:05Z07:00" }}' class="text-xs text-neutral-400">{{ .Timestamp.Format "Jan 2, 2006 3:04 PM" }}</time>
                </div>
                <p class="text-sm text-neutral-600 leading-relaxed">{{.Message}}</p>
            </div>
            {{end}}    
        </div>
   

    </main>

    {{template "footer" .}}
    <script src="/static/js/localtime.js" defer></script>
</body>

</html>

{{end}}
